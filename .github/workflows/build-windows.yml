name: Build Windows executable
on:
  workflow_dispatch:
  push:
    branches: [macos-practice-filters]
    paths: [.github/workflows/build-windows.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quantum-algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-algorithm-windows-x64
          path: quantum-algorithm/src-tauri/target/release/quantum-algorithm.exe
          if-no-files-found: error
